name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify — Linux and WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build Linux application
        run: go build -o bin/IFC-Raw-Viewer_mk2 ./cmd/stepview

      - name: Build WebAssembly application
        run: GOOS=js GOARCH=wasm go build -o bin/IFC-Raw-Viewer_mk2.wasm ./cmd/stepview
