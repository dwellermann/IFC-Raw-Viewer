name: Build & Release

on:
  push:
    tags:
      - 'mk*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build — Windows Portable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Install Fyne cross compiler
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build Windows portable package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.0.0-dev"
          fi
          APP_NAME="IFC-Raw-Viewer_mk2_${VERSION}_windows_amd64"
          "$(go env GOPATH)/bin/fyne-cross" windows \
            -engine docker \
            -arch amd64 \
            -name "${APP_NAME}.exe" \
            -app-id de.wellermann.ifcrawviewer.mk2 \
            -dir "$GITHUB_WORKSPACE" \
            ./cmd/stepview
          mkdir -p dist
          cp "fyne-cross/dist/windows-amd64/${APP_NAME}.exe.zip" "dist/${APP_NAME}.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifc-raw-viewer-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.zip
